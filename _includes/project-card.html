{% include base_path %}

{% assign project_url = post.url | prepend: base_path %}

<article class="project-card" itemscope itemtype="https://schema.org/CreativeWork">
  <a class="project-card__link" href="{{ project_url }}" aria-label="View {{ post.title | strip_html | escape }}">
    <h3 class="project-card__title" itemprop="headline">{{ post.title | markdownify | remove: "<p>" | remove: "</p>" }}</h3>
    {% if post.excerpt %}
      <p class="project-card__excerpt" itemprop="description">{{ post.excerpt | markdownify | remove: "<p>" | remove: "</p>" }}</p>
    {% endif %}
    <span class="project-card__action">View project <span aria-hidden="true">→</span></span>
  </a>
</article>
